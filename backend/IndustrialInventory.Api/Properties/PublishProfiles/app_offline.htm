<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="15">
  <title>Industrial Inventory is being updated</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #f4f6f9;
      color: #1f2a37;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 460px;
      padding: 40px 32px;
      background: #ffffff;
      border-top: 6px solid #004b87;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      border: 5px solid #d2e0ec;
      border-top-color: #004b87;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }
    h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
    p { margin: 0 0 10px; line-height: 1.5; color: #4b5563; }
    .small { margin-top: 20px; font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Industrial Inventory is being updated</h1>
    <p>This usually takes a minute or two.</p>
    <p>You don't need to do anything. This page reloads by itself and opens Industrial Inventory as soon as the update is finished.</p>
    <p class="small">If this page is still showing after 10 minutes, contact IT.</p>
  </main>
</body>
</html>
